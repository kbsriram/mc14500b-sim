<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC14500B Simulator</title>
<style>
:root {
  --bg: #efefeb; --paper: #f8f8f5; --rail: #f3f3ef; --ink: #383b40; --ink2: #5e6268; --ink3: #73777d; --line: #dadad4;
  --sym: #7a7e85; --symfill: #f8f8f5; --frame: #f8f8f5; --frameline: #cfcfc9; --tab: #e8e8e3; --open: #383b40;
  --hi: #d7462a; --lo: #2a62a8; --hiq: #e9a28f; --loq: #93b0d6; --x: #9b3a93; --on: #2f8f5b;
  --accent: #d7462a; --led: #e3a33a; --hot: #383b40;
  --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #232529; --paper: #2a2d32; --rail: #26292d; --ink: #dcdde0; --ink2: #a7abb1; --ink3: #8d9298; --line: #3a3e44;
    --sym: #8d9198; --symfill: #2e3136; --frame: #2a2d32; --frameline: #42464c; --tab: #33373c; --open: #dcdde0;
    --hi: #ee6a4c; --lo: #5e98dc; --hiq: #7c4436; --loq: #35557c; --x: #d261c8; --on: #45b97c; --accent: #ee6a4c; --led: #e8b04a; --hot: #dcdde0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #232529; --paper: #2a2d32; --rail: #26292d; --ink: #dcdde0; --ink2: #a7abb1; --ink3: #8d9298; --line: #3a3e44;
    --sym: #8d9198; --symfill: #2e3136; --frame: #2a2d32; --frameline: #42464c; --tab: #33373c; --open: #dcdde0;
    --hi: #ee6a4c; --lo: #5e98dc; --hiq: #7c4436; --loq: #35557c; --x: #d261c8; --on: #45b97c; --accent: #ee6a4c; --led: #e8b04a; --hot: #dcdde0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/16px var(--sans); overflow: hidden; }   /* an 8 px grid: sizes and gaps in its steps */
button, select, input { font: inherit; color: inherit; }
#app { display: flex; height: 100vh; }

/* rail */
#rail { width: 360px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; transition: margin .2s; }
#app.norail #rail { margin-left: -360px; }
.brand { padding: 24px 24px 16px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 24px; line-height: 24px; font-weight: 700; letter-spacing: -.02em; }
.scroll { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; }
section.sec { padding: 16px 24px 24px; border-bottom: 1px solid var(--line); }
.sec h2 { margin: 0 0 16px; font-size: 11px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); display: flex; align-items: center; gap: 8px; }
.sec h2 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.transport { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; height: 32px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink3); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 80px; justify-content: center; }
.btn svg { width: 14px; height: 14px; }
.row { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.row label { color: var(--ink2); }
input[type=range] { flex: 1; accent-color: var(--accent); }
.mono { font-family: var(--mono); font-size: 12px; }
.dim { color: var(--ink2); }
.stat { display: grid; grid-template-columns: 88px 1fr; gap: 0 8px; margin-top: 16px; font-size: 12px; line-height: 24px; }
.stat dt { color: var(--ink3); } .stat dd { margin: 0; font-family: var(--mono); white-space: pre; }

/* card */
.bank { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.sw { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; height: 40px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font: 10px var(--mono); color: var(--ink2); padding: 0; }
.sw i { width: 16px; height: 8px; border-radius: 1px; background: color-mix(in srgb, var(--ink3) 40%, var(--paper)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink3) 60%, transparent); margin-bottom: 3px; transition: background .1s; }
.sw.on i { background: var(--hi); } .sw.on { color: var(--ink); }
.sw.fixed { cursor: default; opacity: .75; }
.led { display: flex; flex-direction: column; align-items: center; font: 10px var(--sans); color: var(--ink2); gap: 3px; }
.led b { width: 14px; height: 14px; border-radius: 50%; background: color-mix(in srgb, var(--ink3) 35%, var(--paper)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink3) 70%, transparent); transition: background .08s, box-shadow .08s; }
.led.on b { background: var(--led); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 20%, transparent); }
.pins { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.pins .led.on b { background: var(--hi); }
.sub { font-size: 11px; line-height: 16px; color: var(--ink2); margin: 16px 0 8px; }

/* editor */
.ed { position: relative; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); overflow: hidden; height: 280px; display: flex; }
.gut { width: 30px; flex: none; text-align: right; padding: 8px 6px 8px 0; font: 11.5px/18px var(--mono); color: var(--ink3); background: var(--rail);
  border-right: 1px solid var(--line); overflow: hidden; user-select: none; white-space: pre; }
.gut .e { color: var(--hi); font-weight: 700; }
.ta { position: relative; flex: 1; min-width: 0; }
.ta textarea, .ta .hl { position: absolute; inset: 0; margin: 0; border: 0; padding: 8px 10px; font: 11.5px/18px var(--mono); white-space: pre; overflow: auto; tab-size: 4; scrollbar-width: thin; }
.ta textarea { background: transparent; color: var(--ink); resize: none; outline: none; z-index: 1; }
.ta .hl { pointer-events: none; color: transparent; overflow: hidden; }
.hl .cur { background: color-mix(in srgb, var(--led) 28%, transparent); }
.hl .err { background: color-mix(in srgb, var(--hi) 18%, transparent); }
#errors { color: var(--hi); font: 12px var(--mono); white-space: pre-wrap; margin-top: 6px; min-height: 0; }
select { border: 1px solid var(--line); background: var(--paper); border-radius: 3px; height: 24px; padding: 0 8px; }

/* stage */
#stage { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
#view { flex: 1; min-height: 0; position: relative; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
#svg { --fade: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent), linear-gradient(to bottom, transparent, #000 24px, #000 calc(100% - 24px), transparent);
  mask-image: var(--fade); mask-composite: intersect; }   /* parts cut by the view's edge fade out */
#svg.panning { cursor: grabbing; }
.float { position: absolute; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; }
#tools { right: 16px; top: 16px; display: flex; padding: 3px; gap: 2px; }
#tools button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 3px; cursor: pointer; color: var(--ink2); display: grid; place-items: center; }
#tools button:hover { background: var(--tab); color: var(--ink); }
#tools button.act { background: var(--ink); color: var(--paper); }
#tools .sep { width: 1px; background: var(--line); margin: 4px 3px; }
#tools svg { width: 16px; height: 16px; }
#legend { right: 16px; bottom: 16px; padding: 8px 16px; display: flex; gap: 14px; font-size: 11px; color: var(--ink2); }
#legend span { display: flex; align-items: center; gap: 6px; }
#legend i { width: 18px; height: 0; border-top: 2.5px solid; }
#tip { position: absolute; pointer-events: none; padding: 4px 8px; font: 12px var(--mono); border-radius: 3px; background: var(--ink); color: var(--paper);
  white-space: nowrap; display: none; z-index: 5; }
#tip small { color: var(--ink3); }
#railbtn { left: 16px; bottom: 16px; padding: 0; }
#railbtn button { border: 0; background: transparent; width: 34px; height: 32px; cursor: pointer; color: var(--ink2); display: grid; place-items: center; }

/* waves */
#drawer { flex: none; height: 0; border-top: 1px solid var(--line); background: var(--paper); position: relative; transition: height .18s; display: flex; flex-direction: column; }
#app.waves #drawer { height: 290px; }
#app.waves #wavetab { display: none; }
#drawer header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink2); }
#drawer header b { color: var(--ink); font-weight: 600; }
#drawer canvas { flex: 1; min-height: 0; width: 100%; display: block; cursor: ew-resize; }
#wavetab { position: absolute; left: 50%; top: -28px; transform: translateX(-50%); }
#wavetab button { border: 1px solid var(--line); border-bottom: 0; background: var(--paper); border-radius: 3px 3px 0 0; padding: 4px 16px; cursor: pointer; color: var(--ink2); font-size: 12px; }

/* the schematic */
.sym, .w, .frame, .qual, .inner, .ch, .tag, .stub { vector-effect: non-scaling-stroke; }
.sym { fill: var(--symfill); stroke: var(--sym); stroke-width: 1.3; stroke-linejoin: round; }
.sym.weak { stroke: var(--ink3); }
.sym.dummy, .dummy .sym { opacity: .35; }
.inner { fill: none; stroke: var(--sym); stroke-width: 1.2; }
.qual { fill: none; stroke: var(--sym); stroke-width: 1; }
.blk { fill: var(--symfill); stroke-width: 1.5; }
.hit { fill: transparent; }
.w { fill: none; stroke: var(--ink3); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
.w.hi { stroke: var(--hi); } .w.lo { stroke: var(--lo); }
.w.q { stroke-dasharray: 4 3; } .w.q.hi { stroke: var(--hiq); } .w.q.lo { stroke: var(--loq); }
.w.x { stroke: var(--x); stroke-width: 2.4; }
.dot { fill: var(--ink3); } .dot.hi { fill: var(--hi); } .dot.lo { fill: var(--lo); } .dot.x { fill: var(--x); }
.dot.q.hi { fill: var(--hiq); } .dot.q.lo { fill: var(--loq); }
.ch { stroke: var(--ink3); stroke-width: 1.5; }
.ch.on { stroke: var(--on); stroke-width: 3.5; }
.w.hot { stroke-width: 3.2; filter: drop-shadow(0 0 2px color-mix(in srgb, var(--hot) 40%, transparent)); }
.dot.hot { r: 6; }
.pl { font: 9px var(--mono); fill: var(--ink2); }
.pl, .tt, .pinl { paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.tiny .pl, .tiny .tt, .tiny .pinl, .tiny .bs { display: none; }
.bt { font-weight: 650; fill: var(--ink2); letter-spacing: .02em; }
.bs { fill: var(--ink2); }
.frame { fill: var(--frame); stroke: var(--open); stroke-width: 1.75; }   /* an open part: its outline stronger than a closed one's */
.frame.block { fill: color-mix(in srgb, var(--frame) 85%, transparent); }
.olab { cursor: pointer; }
.olabbg { fill: var(--tab); stroke: var(--frameline); stroke-width: 1; vector-effect: non-scaling-stroke; }
.olab.open .olabbg { fill: var(--open); stroke: var(--open); }
.olabt { fill: var(--ink2); font-family: var(--sans); font-weight: 600; }
.olab.open .olabt { fill: var(--paper); }
.olab:hover .olabbg { stroke: var(--open); } .olab:hover .olabt { fill: var(--ink); } .olab.open:hover .olabt { fill: var(--paper); }
.tag { fill: var(--paper); stroke: var(--ink3); stroke-width: 1; }
.tagg .tag.hi { stroke: var(--hi); } .tagg .tag.lo { stroke: var(--lo); }
.tt { font: 9px var(--mono); fill: var(--ink); }
.pinl { font: 10px var(--mono); fill: var(--ink3); }
.frame.chip { fill: var(--paper); stroke: var(--sym); stroke-width: 1.6; }
.pinlbl { font: 700 48px var(--sans); fill: var(--ink); }
.pinno { font: 16px var(--mono); fill: var(--ink3); }
/* the card around the chip, in chip layout units */
.bx { fill: var(--paper); stroke: var(--sym); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.btitle { font: 700 64px var(--sans); fill: var(--ink); }
.bsub { font: 44px var(--sans); fill: var(--ink2); }
.blab { font: 40px var(--mono); fill: var(--ink2); }
.bval { font: 44px var(--mono); fill: var(--ink); }
.btag { fill: var(--paper); stroke: var(--ink3); stroke-width: 1; vector-effect: non-scaling-stroke; }
.btag.hi { stroke: var(--hi); } .btag.lo { stroke: var(--lo); }
.btagt { font: 40px var(--mono); fill: var(--ink); }
.bgate, .bres { fill: var(--symfill); stroke: var(--sym); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.bres { fill: none; }
.lamp { fill: var(--tab); stroke: var(--ink3); stroke-width: 1; vector-effect: non-scaling-stroke; }
.lamp.hi { fill: var(--hi); stroke: var(--hi); } .lamp.lampled.hi { fill: var(--led); stroke: var(--led); }
.bsw { cursor: pointer; }
.swb { fill: var(--tab); stroke: var(--ink3); stroke-width: 1; vector-effect: non-scaling-stroke; } .swb.hi { fill: color-mix(in srgb, var(--hi) 25%, var(--paper)); stroke: var(--hi); }
.knob { fill: var(--ink2); transition: transform .08s; } .knob.hi { fill: var(--hi); transform: translateX(56px); }
.picked .sym, .picked.part .sym { stroke: var(--accent); stroke-width: 2.2; }
</style>
</head>
<body>
<div id="app" class="waves">
  <aside id="rail">
    <div class="brand"><h1>MC14500B</h1></div>
    <div class="scroll">
      <section class="sec">
        <h2>Run <span class="r mono dim" id="clock"></span></h2>
        <div class="transport">
          <button class="btn primary" id="run" title="Run or pause (space)"></button>
          <button class="btn" id="half" title="Run until X1 next changes level">½ step</button>
          <button class="btn" id="step" title="Run until X1 next rises: one instruction">Step</button>
          <button class="btn" id="reset" title="Hold RST high for 100 µs, as at power-up">Reset</button>
        </div>
        <div class="row"><label for="speed">Speed</label><input id="speed" type="range" min="0" max="100" value="18"><span class="mono" id="speedv"></span></div>
        <dl class="stat">
          <dt>PC</dt><dd id="pc"></dd>
          <dt>Instruction</dt><dd id="ir"></dd>
          <dt>Executed</dt><dd id="count"></dd>
          <dt>Time</dt><dd id="time"></dd>
        </dl>
      </section>
      <section class="sec">
        <h2 title="The handbook's Figure 4.1 system">Card</h2>
        <div class="sub">Inputs</div>
        <div class="bank" id="ins"></div>
        <div class="sub">Outputs</div>
        <div class="bank" id="outs"></div>
        <div class="sub">Pins</div>
        <div class="pins" id="pins"></div>
        <div class="row"><button class="btn" id="halt" title="The card's Run/Halt latch holds RST high">Halt</button></div>
      </section>
      <section class="sec">
        <h2>Program <span class="r"><select id="example"></select></span></h2>
        <div class="ed"><div class="gut" id="gut"></div><div class="ta"><div class="hl" id="hl"></div><textarea id="src" spellcheck="false" wrap="off"></textarea></div></div>
        <div id="errors"></div>
        <div class="row"><button class="btn" id="assemble" title="Ctrl+Enter. Operands: RR, IN1–IN7, OUT0–OUT7">Assemble &amp; load</button></div>
      </section>
    </div>
  </aside>
  <main id="stage">
    <div id="view">
      <svg id="svg"><g id="world"></g></svg>
      <div id="tools" class="float">
        <button id="zin" title="Zoom in (+)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
        <button id="zout" title="Zoom out (−)"><svg viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
        <button id="fit" title="Fit the chip (0)"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
        <button id="collapse" title="Close every part (C)"><svg viewBox="0 0 16 16"><path d="M5 2l3 3 3-3M5 14l3-3 3 3M2 8h12" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
        <span class="sep"></span>
        <button id="wavesbtn" title="Waveforms (W)"><svg viewBox="0 0 16 16"><path d="M1 11h3V5h4v6h4V5h3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
        <button id="theme" title="Light or dark"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 3a5 5 0 0 1 0 10z" fill="currentColor"/></svg></button>
      </div>
      <div id="legend" class="float">
        <span><i style="border-color:var(--hi)"></i>high</span><span><i style="border-color:var(--lo)"></i>low</span>
        <span><i style="border-color:var(--loq);border-top-style:dashed"></i>charge only</span><span><i style="border-color:var(--x)"></i>contention</span>
        <span><i style="border-color:var(--on);border-top-width:3.5px"></i>conducting</span>
      </div>
      <div id="railbtn" class="float"><button id="railt" title="Show or hide the panel ([)"><svg viewBox="0 0 16 16" width="16" height="16"><rect x="2" y="3" width="12" height="10" rx="2" stroke="currentColor" fill="none" stroke-width="1.4"/><path d="M6 3v10" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
      <div id="tip"></div>
    </div>
    <section id="drawer">
      <div id="wavetab"><button id="wavetabb">Waveforms</button></div>
      <header><b>Waveforms</b><span class="mono" id="wspan" style="margin-left:auto"></span></header>
      <canvas id="waves" title="Click a wire to add it. Drag or scroll to move in time; double-click to follow."></canvas>
    </section>
  </main>
</div>
<script src="base.js"></script>
<script src="netlist.js"></script>
<script src="engine.js"></script>
<script src="parts.js"></script>
<script src="card.js"></script>
<script src="asm.js"></script>
<script src="symbols_data.js"></script>
<script src="symbols.js"></script>
<script src="gen/mc14500b.js"></script>
<script src="gen/layouts/index.js"></script>
<script src="route.js"></script>
<script src="schem.js"></script>
<script src="board.js"></script>
<script src="waves.js"></script>
<script src="top.js"></script>
</body>
</html>
